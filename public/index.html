<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <title>GameShelf</title>
  <meta name="description" content="Discover every game, find where to buy it, and share the games you've played.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <!-- App shell in the style of a desktop game launcher: top bar, sidebar, content. -->
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <a href="#/" class="logo" aria-label="GameShelf home">Game<span>Shelf</span></a>
      <div class="history">
        <button type="button" class="ghost-btn" id="go-back" aria-label="Back"></button>
        <button type="button" class="ghost-btn" id="go-forward" aria-label="Forward"></button>
      </div>
    </div>
    <div class="topbar-center">
      <a href="#/" class="round-btn" id="home-btn" aria-label="Home"></a>
      <button type="button" class="search-pill" id="search-open" aria-label="Search games (Ctrl+K)"></button>
    </div>
    <div class="topbar-right" id="nav-right"></div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Main"></aside>

  <div class="content">
    <main id="app" tabindex="-1"></main>
    <footer class="footer">
      <p>GameShelf doesn't sell anything. Every buy button goes straight to the store. <a href="#/legal">About & legal</a></p>
      <p id="data-credit"></p>
      <p>Game names, art and trademarks belong to their owners. Not affiliated with Valve, Twitch or any publisher.</p>
    </footer>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="palette-root"></div>
</body>
</html>
