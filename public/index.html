<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameShelf</title>
  <meta name="description" content="Discover every game, find where to buy it, and share the games you've played.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="logo">Game<span>Shelf</span></a>
      <form class="search" id="search-form" role="search">
        <input type="search" id="search-input" placeholder="Search any game…" aria-label="Search games" autocomplete="off">
      </form>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer">
    GameShelf doesn't sell games. Store buttons take you to the official stores.
    <span id="data-credit"></span>
  </footer>
</body>
</html>
